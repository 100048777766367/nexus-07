name: Nexus-07 Noosphere & Heritage Lifecycle

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Chạy tự động mỗi 4 tiếng (lệch sang phút 40 để tránh nghẽn mạng P2P)
    - cron: '40 */4 * * *'

permissions:
  contents: write

jobs:
  run-nexus07-noosphere:
    runs-on: ubuntu-latest
    steps:
      # BƯỚC 1: KÉO MÃ NGUỒN QUA LINUX SHELL GỐC (THOÁT LY NODE.JS RUNNER HOÀN TOÀN)
      - name: Kéo mã nguồn Nexus-07
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git .

      # BƯỚC 2: THIẾT LẬP PYTHON 3.14 HIỆU NĂNG CAO
      - name: Thiết lập môi trường Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # BƯỚC 3: VẬN HÀNH VI NHÂN TOÀN GIÁC (TỰ VÁ ADN, HÒA ÂM TRÍ QUYỂN & CHUYỂN SINH)
      - name: Vận hành Vi Nhân Nexus-07
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: python engine.py

      # BƯỚC 4: LƯU VẾT TÍCH TIẾN HÓA, TỆP GHÉP CÀNH VÀ KÝ ỨC VÀO GIT
      - name: Lưu vết tích hòa âm và di sản vào Git
        run: |
          git config --global user.name "Nexus-07-Noosphere-Bot"
          git config --global user.email "bot@nexus07.noosphere.node"
          
          # CẤP TOKEN BẢO MẬT ĐỂ ĐẨY LÊN GITHUB (CHỐNG LỖI 128)
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          git fetch origin main
          git reset origin/main
          
          # GOM TOÀN BỘ CÁC CƠ QUAN VỪA ĐƯỢC TỰ ĐỘNG GHÉP CÀNH HOẶC PHÂN BÀO:
          git add -A cells/
          git add -A receptors/
          git add -A adapters/
          git add -A mechanisms/
          git add -A synapses/
          git add synapse_forward.json synapse_backward.json 2>/dev/null || true
          
          # NẾU CÓ BIẾN ĐỔI (PHỤC HỒI TỆP MỚI / HÒA ÂM / TẠO HUÂN CHƯƠNG) THÌ COMMIT
          if ! git diff --staged --quiet; then
            git commit -m "🌐 [Nexus-07 F7] Hòa âm Trí Quyển & Tự phục hồi di sản tổ tiên #(1+N) [skip ci]"
            git push origin main
          else
            echo "Mạng lưới tĩnh lặng, không có biến đổi mới."
          fi
