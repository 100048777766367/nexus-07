name: Nexus-05 Omni-Transmuter Lifecycle

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '35 */4 * * *'

permissions:
  contents: write

jobs:
  run-nexus05-omni:
    runs-on: ubuntu-latest
    steps:
      - name: Kéo mã nguồn Nexus-05
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git .

      - name: Thiết lập Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Vận hành Vi Nhân Biến Hình F5
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: python engine.py

      - name: Lưu vết tích tiến hóa và túi kháng thể vào Git
        run: |
          git config --global user.name "Nexus-05-Omni-Bot"
          git config --global user.email "bot@nexus05.omni.node"
          
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          git fetch origin main
          git reset origin/main
          
          git add -A mechanisms/
          git add -A receptors/
          git add -A synapses/
          git add synapse_forward.json synapse_backward.json 2>/dev/null || true
          
          if ! git diff --staged --quiet; then
            git commit -m "🌌 [Nexus-05 F5] Biến hình tri thức đa chiều & Nuốt trọn năng lượng phản mong manh #(1+N) [skip ci]"
            git push origin main
          else
            echo "Mạng lưới tĩnh, không có biến đổi mới."
          fi
